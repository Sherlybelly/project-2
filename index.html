<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday in the Stars</title>
    <link rel="stylesheet" href="styles.css">
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Condiment&family=Gloria+Hallelujah&family=Jost:ital,wght@0,441;1,441&family=Just+Me+Again+Down+Here&family=Nabla&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Reenie+Beanie&family=Rock+Salt&family=Rubik+Iso&family=Rubik+Pixels&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Audiowide&family=Condiment&family=Gloria+Hallelujah&family=Jost:ital,wght@0,441;1,441&family=Just+Me+Again+Down+Here&family=Michroma&family=Nabla&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Reenie+Beanie&family=Rock+Salt&family=Rubik+Iso&family=Rubik+Pixels&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    
  
</head>
<body>
    <h1>Discover your Cosmic Birthday</h1>
    <p>Enter your birthday to discover your zodiac sign</p>

    <label for="birthday">Enter your birthday:</label>
    <input type="date" id="birthday">

    <audio id ="backgroundMusic" loop>
        <source src = "Tombaugh Regio (The Heart).mp3" type="audio/mpeg">
    </audio>

    <button id="submitBirthday">Discover My Birthday</button>
    <button id="musicButton">Play Music</button>
   
    <p id="resultMessage"></p>
    <h2 id="zodiacName"></h2>
    <h2 id="apodTitle"></h2>
    <img id="apodImage" alt="NASA Astronomy Picture">
    <p id="apodDate"></p>
    <p id="apodExplanation"></p>
    <p id="apodCredit"></p>
<div class="planet earth"></div>
<div class="planet venus"></div>
  <div class="sun"></div>

    <script src="script.js"></script>
</body>
</html>
