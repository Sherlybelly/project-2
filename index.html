<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday in the Stars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    
  
</head>
<body>
    <h1>Discover your Cosmic Birthday</h1>
    <p>Enter your birthday to discover your zodiac sign</p>

    <label for="birthday">Enter your birthday:</label>
    <input type="date" id="birthday">

    <button id="submitBirthday">Discover My Birthday</button>
   
    <p id="resultMessage"></p>
    <h2 id="zodiacName"></h2>
    <h2 id="apodTitle"></h2>
    <img id="apodImage" alt="NASA Astronomy Picture">
    <p id="apodDate"></p>
    <p id="apodExplanation"></p>
    <p id="apodCredit"></p>

    
</body>
</html>
